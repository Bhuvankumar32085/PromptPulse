[project]
name = "promptpulse"
version = "0.1.0"
description = "LLM Response Variability & Consistency Tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "typer>=0.15.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "transformers>=4.48.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
semantic = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
promptpulse = "promptpulse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
